<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .conteiner {
            display: flex;
            color: lightsalmon;
        }
        .item {
            flex-basis: 90px;
            
            padding: 10px;
            color: black;
            border: 1px solid black;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item"> A </div>
        <div class="item"> Bola </div>
        <div class="item"> C </div>
        <div class="item"> Dado </div>
        <div class="item"> Escola </div>
        <div class="item"> F </div>
        <div class="item"> Garfo </div>
    </div>
</body>
</html>
