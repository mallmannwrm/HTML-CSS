<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizando items</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;

            font-family: Helvetica, sans-serif;
        }
        body {
            background-image: linear-gradient(to left, rgba(0, 0, 0, 0.8) 5%, rgba(91, 91, 91, 0.7) 80%);
            background-size: cover;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;

            height: 100vh;
            width: 100vw;
        }
        main {
            height: 70vh;
            width: 70vw;

            display: flex;
            align-items: center;
            justify-content: center;
        }
        section {
            background-color: rgb(255, 255, 255);
            border-radius: 20px;
            width: 300px;
            height: 400px;
        }
        section > h1 {
            text-align: center;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de login</h1>
        </section>
    </main>
</body>
</html>
