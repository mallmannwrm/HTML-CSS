<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .conteiner {
            display: flex;
            background-color: rgb(238, 71, 0);

            flex-flow: row nowrap;
        }
        .item {

            color: black;
            padding: 10px;
            border: 1px solid black;
            background-color: lightblue;
        }
        #cxA {
            flex: 0 1 200px;
        }
        #cxB {
            flex: 0 9 200px;
        }
        #cxC {
            flex: 0 1 200px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA"> A </div>
        <div class="item" id="cxB"> B </div>
        <div class="item" id="cxC"> C </div>
    </div>
</body>
</html>
